# Simulador DAD (Vue) — sirve en el subdominio app.inglobals.com. Copia esto
# a /etc/nginx/sites-available/inglobals-app en el servidor. Si usas otro
# subdominio, reemplaza las dos apariciones de app.inglobals.com.
#
# certbot reescribe este archivo automáticamente para agregar HTTPS (bloque
# 443 + redirect 80->443) cuando corras `certbot --nginx` — no hace falta
# escribir esa parte a mano.

server {
    listen 80;
    listen [::]:80;
    server_name app.inglobals.com;

    root /home/inglobals/vue-inglobalsApp/frontend/dist;
    index index.html;

    # API — todo lo que empiece con /api/ va al backend (Gunicorn/Uvicorn
    # escuchando solo en localhost, nunca expuesto directo a internet).
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Las consultas reales tardan varios segundos (2 llamadas a Gemini +
        # 5 fetches web en paralelo) — el timeout por defecto de Nginx (60s)
        # ya alcanza, pero lo subimos un poco de margen.
        proxy_read_timeout 90s;
    }

    # Frontend — Vue compilado (SPA).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cachea assets con hash en el nombre (Vite los genera así) agresivamente.
    location ~* \.(js|css|png|jpg|jpeg|svg|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
