# Sitio de marketing (Astro) — sirve en el dominio raíz inglobals.com. Copia
# esto a /etc/nginx/sites-available/inglobals-landing en el servidor. Es
# 100% estático (astro.config.mjs no tiene adaptador de servidor), así que
# no necesita systemd ni un proceso Node corriendo — solo estos archivos.
#
# certbot reescribe este archivo automáticamente para agregar HTTPS cuando
# corras `certbot --nginx`.

server {
    listen 80;
    listen [::]:80;
    server_name inglobals.com www.inglobals.com;

    root /home/inglobals/vue-inglobalsApp/landing/dist;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|svg|webp|woff2?|mp4)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
