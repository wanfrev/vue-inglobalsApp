# Un solo dominio, dos apps: la landing de Astro en "/" y el simulador Vue
# en "/simulador/". Copia esto a /etc/nginx/sites-available/inglobals en el
# servidor. Si tu dominio no es inglobals.com, reemplaza las 2 apariciones
# de server_name.
#
# certbot reescribe este archivo automáticamente para agregar HTTPS cuando
# corras `certbot --nginx` — no hace falta escribir esa parte a mano.

server {
    listen 80;
    listen [::]:80;
    server_name inglobals.com www.inglobals.com;

    # Landing (Astro, estático) — todo lo que no matchee las rutas de abajo.
    root /home/inglobals/vue-inglobalsApp/landing/dist;
    index index.html;

    # API del simulador — el backend corre en localhost, nunca expuesto
    # directo a internet.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Una consulta real hace 2 llamadas a Gemini (60s de timeout cada
        # una, ver app/core/engine.py) más la búsqueda RAG y los fetches web
        # en vivo — en el peor caso puede acercarse a ~130s.
        proxy_read_timeout 150s;
    }

    # Simulador (Vue, estático, compilado con base:'/simulador/' en
    # vite.config.js). "^~" es clave acá: sin eso, la location de assets con
    # regex de más abajo le ganaría a esta y buscaría los archivos del
    # simulador dentro de landing/dist en vez de frontend/dist, rompiendo el
    # JS/CSS del simulador.
    location ^~ /simulador/ {
        alias /home/inglobals/vue-inglobalsApp/frontend/dist/;
        try_files $uri $uri/ /simulador/index.html;
    }

    # Sin la barra final ("/simulador") — redirige a la versión con barra de
    # arriba, para que las rutas relativas del index.html resuelvan bien.
    location = /simulador {
        return 301 /simulador/;
    }

    # Landing — SPA-like fallback simple para Astro (páginas .astro se
    # compilan a archivos .html).
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Cachea assets con hash agresivamente — aplica a la landing; los del
    # simulador ya quedan cubiertos por el bloque "^~ /simulador/" de arriba
    # (que tiene prioridad).
    location ~* \.(js|css|png|jpg|jpeg|svg|webp|woff2?|mp4)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
